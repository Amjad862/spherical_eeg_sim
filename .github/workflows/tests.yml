name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Undefined names, unused imports and syntax errors in the package, the
  # experiment scripts, the tests and the examples. The experiment scripts are
  # not executed by the test suite, so this is the check that reaches them.
  lint:
    name: "lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[lint]"
      - name: Run ruff
        run: ruff check .

  # Full suite, including the MNE cross-implementation checks, the MATLAB v7.3
  # and plotting backends, and the contract tests of the experiment scripts.
  # The Windows job covers process spawning and the Windows-specific cleanup
  # paths of staged publication.
  tests:
    name: "${{ matrix.os }}, python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,plot]"
      - name: Run tests
        run: pytest -q

  # The lowest interpreter the package supports. Optional backends are omitted
  # here; the suite skips the tests that need them, so this job checks that the
  # core generator runs on a bare install.
  minimum-supported:
    name: "python 3.10 (core dependencies only)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Run tests
        run: pytest -q

  typing:
    name: "static typing"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[typing]"
      - name: Run mypy
        run: mypy spherical_eeg_sim

  # The archived validation results, the parameter documentation, and the
  # scripts that produced them must stay bound together.
  validation-manifest:
    name: "validation manifest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify checksums
        run: sha256sum -c validation_results/SHA256SUMS
      - name: Verify manifest is in sync
        run: python scripts/make_validation_manifest.py --check
