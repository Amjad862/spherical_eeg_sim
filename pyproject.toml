[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spherical_eeg_sim"
dynamic = ["version"]
description = "Configurable EEG source localization dataset generator with continuous orientations, three source modes, and position-level held-out splits."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Amjad Sultan Awan", email = "amawan@ttu.edu"},
    {name = "Mary C. Baker"},
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = ["EEG", "source localization", "deep learning", "neuroscience", "simulation"]

dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "h5py>=3.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.4"]
mne  = ["mne>=1.0", "pandas>=1.3"]
mat = ["hdf5storage>=0.2"]
benchmark = ["scikit-learn>=1.0"]
validation = ["mpmath>=1.2"]
test = ["pytest>=7.0", "mne>=1.0", "pandas>=1.3", "hdf5storage>=0.2", "mpmath>=1.2"]
typing = ["mypy>=1.15"]
all  = ["matplotlib>=3.4", "mne>=1.0", "pandas>=1.3", "pytest>=7.0", "hdf5storage>=0.2", "scikit-learn>=1.0", "mpmath>=1.2"]

[project.scripts]
spherical-eeg-sim = "spherical_eeg_sim.cli:main"

[project.urls]
Homepage = "https://github.com/Amjad862/spherical_eeg_sim"
Repository = "https://github.com/Amjad862/spherical_eeg_sim"
Issues = "https://github.com/Amjad862/spherical_eeg_sim/issues"

[tool.setuptools.dynamic]
# Single source of truth for the version: spherical_eeg_sim.__version__.
version = {attr = "spherical_eeg_sim.__version__"}

[tool.setuptools]
packages = [
    "spherical_eeg_sim",
    "spherical_eeg_sim.core",
    "spherical_eeg_sim.sources",
    "spherical_eeg_sim.signals",
    "spherical_eeg_sim.io",
    "spherical_eeg_sim.validation",
    "spherical_eeg_sim.montages",
    "spherical_eeg_sim.montages._templates",
]
include-package-data = true

[tool.setuptools.package-data]
"spherical_eeg_sim" = ["py.typed"]
"spherical_eeg_sim.montages" = ["*.csv", "_templates/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]", ".DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # The suite uses deliberately tiny position pools for speed, which
    # legitimately trips the patch support-density check. Tests that assert
    # the warning fires capture it explicitly.
    "ignore:Patch support is sparse:RuntimeWarning",
]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
